<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LeetCode Tracker Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>LeetCode Tracker Settings</h1>
      <p>Configure backend API server and authentication tokens</p>
    </header>

    <div class="card">
      <form id="settingsForm">
        <div class="form-group">
          <label for="serverUrl">Backend Server URL</label>
          <input type="url" id="serverUrl" placeholder="http://localhost:5000/api" required>
        </div>

        <div class="form-group">
          <label for="dashboardUrl">Frontend Web Dashboard URL</label>
          <input type="url" id="dashboardUrl" placeholder="http://localhost:3000" required>
        </div>

        <div class="form-group">
          <label for="apiKey">Tracker API Token / Key</label>
          <input type="password" id="apiKey" placeholder="Enter your secret token" required>
          <small>Generate this token in your LeetCode Tracker user profile</small>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-save">Save Settings</button>
          <button type="button" id="testBtn" class="btn btn-test">Test Connection</button>
          <button type="button" id="exportLogsBtn" class="btn btn-outline">Export Logs</button>
        </div>
      </form>
      <div id="statusMessage" class="status-msg"></div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
