<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LeetCode Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <span class="logo-icon">⚡</span>
        <h1>LeetCode Tracker</h1>
      </div>
      <div id="status-badge" class="status-badge disconnected">Disconnected</div>
    </header>

    <section class="toggle-section">
      <label class="switch-label" for="autoSyncToggle">
        <span>Auto-Sync Submissions</span>
        <input type="checkbox" id="autoSyncToggle" checked>
      </label>
    </section>

    <section class="recent-section">
      <h2>Recent Submissions</h2>
      <div id="recent-list" class="recent-list">
        <p class="empty-state">No submissions synced yet.</p>
      </div>
    </section>

    <footer class="popup-footer">
      <button id="syncNowBtn" class="btn btn-primary">Sync Now</button>
      <button id="openOptionsBtn" class="btn btn-secondary">Settings</button>
      <button id="openDashboardBtn" class="btn btn-outline" title="Open Tracker Web App">Web App ↗</button>
    </footer>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
